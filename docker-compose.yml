services:
  mock-server:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      DATA_DIR: /app/data
      DATABASE_URL: file:/app/data/mock-server.db
    ports:
      - "${PORT:-4310}:4310"
    volumes:
      - mock-server-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3

volumes:
  mock-server-data:
